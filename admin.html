<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroCluster НААН–ІІБ — Панель макроаналітики та логів</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div><strong style="font-size:18px;">AgroCluster НААН–ІІБ • Макроаналітика та Журнал Телеметрії</strong></div>
        <a href="index.html" class="admin-link">← Повернутися до платформи</a>
    </header>
    <div class="container-wide">
        <div class="card">
            <h2 class="card-title">Журнал телеметрії та аудиту дій користувачів (Dual-Layer Logs)</h2>
            <p style="font-size:13px; color:#475569;">Серверний вузол: <code>https://cluster-fcsu.onrender.com</code></p>
            <div id="logsContainer" style="font-size:13px;">Завантаження логів...</div>
        </div>
    </div>
    <script>
        const BACKEND_URL = "https://cluster-fcsu.onrender.com";
        async function loadLogs() {
            const localLogs = JSON.parse(localStorage.getItem('agrocluster_logs') || '[]');
            let serverLogs = [];
            try {
                const res = await fetch(`${BACKEND_URL}/api/logs?password=agro2026`);
                if (res.ok) {
                    const data = await res.json();
                    serverLogs = data.logs || [];
                }
            } catch (e) {}
            const all = [...localLogs, ...serverLogs].slice(0, 50);
            const box = document.getElementById('logsContainer');
            if (!all.length) {
                box.innerHTML = "Подій ще не зафіксовано.";
                return;
            }
            box.innerHTML = "<table class='calc-table'><thead><tr><th>Час</th><th>Дія</th><th>Деталі</th></tr></thead><tbody>" +
                all.map(x => `<tr><td>${x.timestamp}</td><td><strong>${x.action}</strong></td><td>${x.details || ''}</td></tr>`).join("") +
                "</tbody></table>";
        }
        loadLogs();
    </script>
</body>
</html>
