name: AgroCluster QA & Firebase + Cloud Run Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-and-integration-tests:
    name: Run Automated QA Pipeline (IIB Draft & Agro-EDRPOU Parser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unittest & pytest verification suite
        run: |
          pytest tests/test_agrocluster.py -v

  deploy-cloudrun-and-firebase:
    name: Deploy Backend to Cloud Run & Frontend to Firebase Hosting
    needs: unit-and-integration-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy FastAPI Backend to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agrocluster-api
          region: europe-west1
          source: .
          flags: "--allow-unauthenticated --min-instances=0 --max-instances=5 --memory=512Mi"

      - name: Deploy Frontend & Rewrites to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: agrocluster-naan-iib
